name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: liuyao-paipan-code/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: liuyao-paipan-code/requirements.txt
      - run: node scripts/validate-skills.mjs
      - run: python scripts/test-distribution.py
      - run: npm ci
        working-directory: liuyao-paipan-code
      - run: python -m pip install -r requirements.txt
        working-directory: liuyao-paipan-code
      - run: npm test
        working-directory: liuyao-paipan-code
